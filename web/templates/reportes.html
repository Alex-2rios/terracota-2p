{% extends "base.html" %}

{% block content %}
  <section class="page-heading">
    <h1>Reportes</h1>
  </section>

  <form class="report-card" method="post" id="formularioReporte">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input id="tipoReporte" type="hidden" name="tipo_reporte" value="ventas">

    <h2>Generar reporte</h2>
    <span class="subtle">Elige qué quieres reportar</span>

    <div class="report-types" id="tiposReporte">
      {% for tipo in catalogo.tipos %}
        <button class="report-type {% if loop.first %}selected{% endif %}" type="button"
                data-report="{{ tipo.clave }}" aria-pressed="{{ 'true' if loop.first else 'false' }}">
          <strong>{{ tipo.nombre }}</strong>
          <small>{{ tipo.descripcion }}</small>
        </button>
      {% endfor %}
    </div>

    <div class="report-summary" id="reportSummary"></div>

    <h3 class="section-icon-title">
      <img src="{{ url_for('static', filename='img/calendario.png') }}" alt="">
      Filtros
    </h3>

    <div class="form-grid compact" id="camposFiltro">
      <label data-campo="fechas">
        <span>Fecha inicio</span>
        <div class="date-input"><input name="fecha_inicio" type="date" value="{{ fecha_inicio }}"></div>
      </label>
      <label data-campo="fechas">
        <span>Fecha fin</span>
        <div class="date-input"><input name="fecha_fin" type="date" value="{{ fecha_fin }}"></div>
      </label>

    </div>

    <h3>¿Qué quieres hacer?</h3>
    <div class="export-actions">
      <button class="primary" type="submit" formaction="{{ url_for('ver_reporte') }}">
        Ver en pantalla
      </button>
      <button class="file-button" type="submit" name="formato" value="pdf"
              formaction="{{ url_for('exportar_reporte') }}"
              title="Descargar en PDF" aria-label="Descargar en PDF">
        <img src="{{ url_for('static', filename='img/pdf.png') }}" alt="PDF">
      </button>
      <button class="file-button" type="submit" name="formato" value="xlsx"
              formaction="{{ url_for('exportar_reporte') }}"
              title="Descargar en Excel" aria-label="Descargar en Excel">
        <img src="{{ url_for('static', filename='img/xlsx.png') }}" alt="XLSX">
      </button>
    </div>
    <p class="export-hint" id="exportHint"></p>
  </form>

  <script id="catalogoReportes" type="application/json">{{ catalogo | tojson }}</script>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='reportes.js') }}"></script>
{% endblock %}
